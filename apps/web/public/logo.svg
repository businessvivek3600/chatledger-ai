<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2B45"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#356AE6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Squircle Badge -->
  <rect width="48" height="48" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Chat Speech Bubble Base Shadow -->
  <path d="M11 23.5C11 16.5 16.8 11 24 11C31.2 11 37 16.5 37 23.5C37 30.5 31.2 36 24 36C21.6 36 19.3 35.3 17.4 34.1L11.5 36L13.1 30.8C11.8 28.6 11 26.1 11 23.5Z" fill="#1E293B" fill-opacity="0.6"/>

  <!-- Geometric Ledger Bars forming 'C' & 'L' Interlock -->
  <!-- Left Pillar -->
  <rect x="14" y="16" width="5.5" height="15" rx="2.75" fill="url(#tealGrad)"/>
  
  <!-- Center Pillar (Taller, Financial Growth) -->
  <rect x="22" y="13" width="5.5" height="18" rx="2.75" fill="url(#blueGrad)"/>

  <!-- Right Pillar -->
  <rect x="30" y="18" width="5.5" height="13" rx="2.75" fill="url(#tealGrad)"/>

  <!-- Bottom Interlocking Ledger Bar -->
  <path d="M14 28.5C14 27.12 15.12 26 16.5 26H31.5C32.88 26 34 27.12 34 28.5V28.5C34 29.88 32.88 31 31.5 31H16.5C15.12 31 14 29.88 14 28.5V28.5Z" fill="url(#tealGrad)"/>

  <!-- Luminous AI Sparkle Star -->
  <circle cx="34" cy="13" r="2.2" fill="#2DD4BF" filter="url(#glow)"/>
  <path d="M34 9.5V16.5M30.5 13H37.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
</svg>
